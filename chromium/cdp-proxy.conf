# Exposes Chrome's CDP (bound to 127.0.0.1:9221 — Chrome 94+ ignores
# --remote-debugging-address) on 0.0.0.0:9222 for other containers.
#
# Not a plain TCP forward: Chrome's DevTools server rejects any request whose
# Host header is not an IP or "localhost" (DNS-rebinding protection), so a
# client addressing it by service name ("http://chromium:9222") would get a 500.
# Upstream requests therefore claim Host: localhost, and the WebSocket URLs
# Chrome builds from that header are rewritten back to the host the client used.
#
# That rewrite must not undo the protection: only hosts that can't be a
# rebinding target get through — IPv4 literals, localhost, and dotless names
# (container/service names like "chromium"). Anything else, or no Host, is 403.
map $http_host $cdp_host_allowed {
    default                                             0;
    "~*^(localhost|[a-z0-9_-]+|\d{1,3}(\.\d{1,3}){3})(:\d+)?$"  1;
}

map $http_upgrade $cdp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9222;

    location / {
        if ($cdp_host_allowed = 0) {
            return 403;
        }
        proxy_pass http://127.0.0.1:9221;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cdp_connection_upgrade;
        # CDP sessions are long-lived WebSockets with idle stretches.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;

        # sub_filter only sees uncompressed bodies.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'ws://localhost/' 'ws://$http_host/';
        sub_filter 'ws=localhost/' 'ws=$http_host/';
    }
}
