# Knowledge-base eval dataset. Everything here is invented.
#
# events: sent in order, each in its own fresh chat, then backdated to `at`.
#   save      — should the agent call kb_write (default true)
#   file      — a fixture from fixtures.py, sent as an attachment
#   facts     — strings that must appear in a live, current fact afterwards
#   stored    — strings that must appear in the stored, searchable text
#   closed    — strings that must appear in a superseded (closed) fact
#   forget    — strings that must no longer be findable afterwards
#   ask       — the write should come back asking which entity was meant
#
# questions: each asked in a brand-new chat, after all events.
#   must      — every item must appear in the answer; a list item is any-of
#   must_not  — none may appear
#   evidence  — must appear in what kb_query / kb_get returned (default: must[0])
#   file      — the fixture respond_with_file should send back
#   judge     — what a correct answer does, for the LLM judge

