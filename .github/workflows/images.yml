# Publishes the standalone stack's images to GHCR on every push to main, so installs
# pull instead of building.  Each architecture builds on a native runner and is pushed
# by digest; the merge job then joins the digests into one multi-arch tag set:
# latest, the version in aug/__init__.py, and sha-<commit>.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Manual runs too publish "latest", so only from main.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: aug
            context: .
          - name: aug-stealth-browser
            context: stealth-browser
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image.name }}-digests-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [aug, aug-stealth-browser]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        id: image
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' aug/__init__.py)
          [ -n "$version" ] || { echo "No __version__ in aug/__init__.py" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ matrix.image }}-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.image.outputs.version }}
            type=sha

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          # Unquoted on purpose: each tag and digest becomes its own argument.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REF@sha256:%s " *)

      - name: Inspect
        env:
          REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.image.outputs.version }}
        run: docker buildx imagetools inspect "$REF:$VERSION"
