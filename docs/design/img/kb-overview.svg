<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Writes extract facts once; reads fuse two searches over the same store"><rect width="760" height="330" rx="8" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Writes extract facts once; reads fuse two searches over the same store</text><text x="24" y="100" font-size="13" font-weight="600" fill="#59636e" text-anchor="start">Write</text><text x="24" y="280" font-size="13" font-weight="600" fill="#59636e" text-anchor="start">Read</text><path d="M244.0 96H268.0" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M408.0 96H432.0" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M572.0 96H596.0" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M666 122.0V160" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M420 212V250.0" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M244.0 276H268" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><path d="M572 276H596.0" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#a)"/><rect x="104.0" y="70.0" width="140" height="52" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="174" y="92" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Read the file</text><text x="174" y="110" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">PDF, vision, speech</text><rect x="268.0" y="70.0" width="140" height="52" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="338" y="92" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Chunk</text><text x="338" y="110" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">about 512 tokens</text><rect x="432.0" y="70.0" width="140" height="52" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="502" y="92" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Extract facts</text><text x="502" y="110" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">one LLM call</text><rect x="596.0" y="70.0" width="140" height="52" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="666" y="92" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Ground, resolve</text><text x="666" y="110" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">drop unquoted facts</text><text x="658" y="148" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end">one transaction</text><rect x="104" y="160" width="632" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="420" y="182" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">PostgreSQL with pgvector</text><text x="420" y="200" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">objects, chunks, entities, bi-temporal facts, profiles; row-level security per user</text><text x="428" y="236" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">chunks and profiles</text><rect x="104.0" y="250.0" width="140" height="52" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="174" y="272" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Question</text><text x="174" y="290" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">vector and key terms</text><rect x="268.0" y="250.0" width="304" height="52" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="420" y="272" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Dense and lexical search, in parallel</text><text x="420" y="290" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">HNSW with a similarity floor; full text</text><rect x="596.0" y="250.0" width="140" height="52" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/><text x="666" y="272" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Fuse ranks</text><text x="666" y="290" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">RRF, then answer</text></svg>
